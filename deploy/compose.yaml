services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    init: true
    ports: ["127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"]
    environment:
      GATEWAY_LISTEN_ADDRESS: 0.0.0.0
      GATEWAY_PORT: "8080"
      GATEWAY_UPSTREAM: http://agent:8000
      GATEWAY_UPSTREAM_HEALTH_PATH: /healthz
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in your environment}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-1}
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_TIMEOUT_MS: ${GATEWAY_REDIS_TIMEOUT_MS:-100}
      GATEWAY_RATE_LIMIT_PREFIX: ${GATEWAY_RATE_LIMIT_PREFIX:-gw:rl}
      GATEWAY_RATE_LIMIT_WINDOW_MS: ${GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}
      GATEWAY_KEY_ID: ${GATEWAY_KEY_ID:-default}
      GATEWAY_RATE_LIMIT_NORMAL: ${GATEWAY_RATE_LIMIT_NORMAL:-120}
      GATEWAY_RATE_LIMIT_MODEL: ${GATEWAY_RATE_LIMIT_MODEL:-10}
      GATEWAY_RATE_LIMIT_UPLOAD: ${GATEWAY_RATE_LIMIT_UPLOAD:-5}
      GATEWAY_ADMISSION_ENABLED: ${GATEWAY_ADMISSION_ENABLED:-1}
      GATEWAY_MODEL_CONCURRENCY: ${GATEWAY_MODEL_CONCURRENCY:-2}
      GATEWAY_MODEL_QUEUE_LIMIT: ${GATEWAY_MODEL_QUEUE_LIMIT:-8}
      GATEWAY_MODEL_QUEUE_BYTES: ${GATEWAY_MODEL_QUEUE_BYTES:-4194304}
      GATEWAY_MODEL_QUEUE_TIMEOUT_MS: ${GATEWAY_MODEL_QUEUE_TIMEOUT_MS:-2000}
    depends_on:
      agent: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
    stop_grace_period: 20s
  agent:
    build:
      context: ${KNOWLEDGE_REVIEW_CONTEXT:-../build/agent-context}
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-0}
    init: true
    env_file: [{path: ./agent.env, required: false}]
    environment:
      KNOWLEDGE_REVIEW_MODEL_WORKERS: ${KNOWLEDGE_REVIEW_MODEL_WORKERS:-2}
    volumes:
      - agent_data:/app/.data
      - agent_models:/app/.models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 40s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
volumes:
  agent_data:
  agent_models:
