# Only for controlled integration tests; no external model traffic.
services:
  gateway:
    ports: !override ["127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"]
  agent:
    # A test run must not inherit unrelated credentials/settings from agent.env.
    env_file: !override []
    environment:
      LLM_API_KEY: public-local-test
      LLM_MODEL: controlled
      LLM_BASE_URL: http://model:9090/v1
    depends_on:
      model: {condition: service_started}
  model:
    image: python:3.12-slim-bookworm
    command: ["python", "/tests/local_model_server.py"]
    volumes: ["../tests:/tests:ro"]
